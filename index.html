   roots=srt.filter(v=>!net.parents[v].length),rest=srt.filter(v=>net.parents[v].length);
  const pcard=v=>{const S=net.states[v];return `<div class="card"><h3>${v}</h3>${net.parents[v].length?`<p class="mut" style="margin:0 0 4px">depends on ${net.parents[v].join(', ')}</p>`:''}${Object.keys(net.cpt[v]).map(k=>`<div class="pr"><span>${cap(v,k)}</span><span class="num">
  ${S.slice(0,-1).map((x,i)=>`<label class="sv"><span class="mut">${x}</span><span class="sl"><input type="range" min="0" max="1" step="0.01" value="${net.cpt[v][k][i]}" aria-label="${x} slider" oninput="pin(this,'${v}','${k}',${i})">
  <input type="number" min="0" max="1" step="0.01" value="${net.cpt[v][k][i]}" aria-label="${x} probability" oninput="pin(this,'${v}','${k}',${i})" onchange="this.value=net.cpt['${v}']['${k}'][${i}];pin(this,'${v}','${k}',${i})"></span></label>`).join('')}
  <span class="sv"><span class="mut">${S[S.length-1]}</span><b class="fv">${net.cpt[v][k][S.length-1]}</b></span></span></div>`).join('')}</div>`};
  h=frame(3,'How likely is each one?','Enter the first numbers, from 0 to 1. The last state fills in by itself so everything adds up to 1.',
   (roots.length?`<h3 class="grp">Start here: nothing influences these</h3>`+roots.map(pcard).join(''):'')+
   (rest.length?`<h3 class="grp">Then these: they depend on the ones above</h3>`+rest.map(pcard).join(''):''),'See my network')}
 if(screen===4)h=frame(4,'Your network','Arrows point from cause to effect. Now ask it a question.',
  `<div class="card"><svg id="svg" viewBox="0 0 640 220" role="img" aria-label="Your Bayesian network"></svg>
  <div class="legend"><span><i style="background:var(--ac)"></i>What you’re asking about</span><span><i style="background:var(--teal)"></i>What you already know</span></div></div>
  <div class="card"><div class="q">How likely is ${sel(qv,"setQ(this.value)",0,ev.map(e=>e.v))} to be ${ssel(qv,qval,"qval=this.value;auto()")}${ev.length?', if we know that:':'?'}</div>
  ${ev.map((e,i)=>`<div class="row">${sel(e.v,`ev[${i}].v=this.value;renderAll()`,0,[qv,...ev.filter((_,j)=>j!==i).map(x=>x.v)])} is ${ssel(e.v,e.val,`ev[${i}].val=this.value;auto()`)}<button class="x" title="Remove" onclick="ev.splice(${i},1);renderAll()">✕</button></div>`).join('')}
  <button class="add" onclick="addEv()" ${vs.some(v=>v!==qv&&!ev.some(e=>e.v===v))?'':'disabled'}><span>+</span>Add something we know</button>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="solve()">Work it out</button></div><div id="res"></div></div>`,'');
 const was=lastScreen,y0=window.scrollY;$('main').classList.toggle('enter',screen!==was);$('main').innerHTML=h;lastScreen=screen;if(screen===was)window.scrollTo(0,y0);
 if(screen==='home')hero();if(screen===4)draw();if(screen==='draw'){attachEd();drawEd()}saveDraft();centre();if(screen===4&&solved)solve()}

// ---------- drawing ----------
function hero(){let r=11;const rnd=()=>(r=r*16807%2147483647)/2147483647,
 H='M200 50C140 30 70 60 62 150C54 230 130 276 200 272Z',L='translate(-5 0)',R='translate(405 0) scale(-1 1)',P=[];   // left hemisphere, mirrored for the right
 for(let y=64;y<=268;y+=30)for(let x=70;x<=330;x+=32){const px=x+(rnd()-.5)*14,py=y+(rnd()-.5)*14,m=Math.min(px,400-px);   // neurons on a loose grid inside the brain
  if(((m-132)/66)**2+((py-160)/104)**2<.82&&Math.abs(px-200)>14)P.push([px,py])}
 let net='',dots='';
 P.forEach((a,i)=>P.forEach((b,j)=>{if(j>i&&Math.hypot(a[0]-b[0],a[1]-b[1])<50){
  net+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--ac)" stroke-opacity=".5" stroke-width="1.4"/>`;
  if((i+j)%9===0)dots+=`<circle r="2.8" style="fill:var(--ac)"><animateMotion dur="${2+(i+j)%3}s" repeatCount="indefinite" path="M${a[0]} ${a[1]}L${b[0]} ${b[1]}"/></circle>`}}));
 P.forEach((a,i)=>net+=`<circle class="pulse" style="animation-delay:${(i%7)*.45}s;fill:var(${i%6?'--ink':'--ac'})" cx="${a[0]}" cy="${a[1]}" r="${i%6?3.2:5.5}"/>`);
 const gy=[84,120,156,192,228,262].map((y,k)=>`<path class="gy" d="M${66+k%2*16} ${y}q16 -16 32 0t32 0t32 0t32 0"/>`).join('');   // folds
 $('hero').innerHTML=`<defs><clipPath id="bc"><path d="${H}" transform="${L}"/><path d="${H}" transform="${R}"/></clipPath>
  <radialGradient id="bgl" cx="50%" cy="45%" r="55%"><stop offset="0" style="stop-color:var(--ac)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--ac)" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="200" cy="170" rx="195" ry="165" fill="url(#bgl)"/>
  <path class="bo" d="${H}" transform="${L}"/><path class="bo" d="${H}" transform="${R}"/>
  <g clip-path="url(#bc)"><g transform="${L}">${gy}</g><g transform="${R}">${gy}</g>${net}${dots}</g>`}
function draw(){const vs=net.variables,L={},rad=v=>Math.max(26,Math.ceil(v.length*3.6+14));   // circle grows with the name
 const lay=v=>L[v]??=net.parents[v].length?1+Math.max(...net.parents[v].map(lay)):0;
 vs.forEach(lay);const rows={};vs.forEach(v=>(rows[L[v]]??=[]).push(v));
 let n=Object.keys(rows).length||1,W=Math.max(300,Math.min(640,$('svg').clientWidth||640)),H=Math.max(220,n*110),pos={};
 for(const[d,ns]of Object.entries(rows))ns.forEach((v,i)=>pos[v]=[W*(i+.5)/ns.length+(ns.length===1&&n>2?(d%2?60:-60):0),44+(H-88)*(n>1?d/(n-1):.5)]);
if(vs.length&&vs.every(v=>net.pos&&net.pos[v])){const xs=vs.map(v=>net.pos[v][0]),ys=vs.map(v=>net.pos[v][1]),m=56,x0=Math.min(...xs),y0=Math.min(...ys),sx=Math.max(...xs)-x0||1,sy=Math.max(...ys)-y0||1,sc=Math.min((W-2*m)/sx,1.3,(460-2*m)/sy);
  H=Math.max(240,sy*sc+2*m);vs.forEach(v=>pos[v]=[m+(W-2*m-sx*sc)/2+(net.pos[v][0]-x0)*sc,m+(net.pos[v][1]-y0)*sc])}   // keep the layout you drew
 let s='<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker></defs>';
 for(const c of vs)for(const p of net.parents[c]){   // curved "axon" with a travelling signal dot
  const[x1,y1]=pos[p],[x2,y2]=pos[c],dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,
  sx=x1+ux*rad(p),sy=y1+uy*rad(p),ex=x2-ux*(rad(c)+6),ey=y2-uy*(rad(c)+6),mx=(sx+ex)/2-uy*l*.1,my=(sy+ey)/2+ux*l*.1,d=`M${sx} ${sy}Q${mx} ${my} ${ex} ${ey}`;
  s+=`<path d="${d}" fill="none" style="stroke:var(--ink)" stroke-width="2.2" marker-end="url(#a)"/><circle r="3.6" style="fill:var(--ac)"><animateMotion dur="2.6s" repeatCount="indefinite" path="${d}"/></circle>`}
 for(const v of vs){const[x,y]=pos[v],e=ev.some(q=>q.v===v),q=v===qv&&!e,f=e?'var(--teal)':q?'var(--ac)':'var(--paper)',t=e||q?'var(--on)':'var(--ink)';
  s+=`<g style="cursor:pointer" onclick="setQ('${v}')"><circle cx="${x}" cy="${y}" r="${rad(v)}" style="fill:${f};stroke:var(--ink)" stroke-width="2.6"/>
  <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" style="fill:${t}" pointer-events="none">${v}</text></g>`}
 $('svg').setAttribute('viewBox',`0 0 ${W} ${H}`);$('svg').innerHTML=s}

// ---------- solving (Python backend) ----------
const call=async state=>{const r=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({network:net,query:{[qv]:state},evidence:Object.fromEntries(ev.map(e=>[e.v,e.val])),method})});
 const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error(NOAPI)}
 if(!r.ok)throw Error(d.error||NOAPI);return d};
async function solve(){
 if(!qv)return;if(!solved)$('res').innerHTML='<p class="mut">Working it out…</p>';
 try{const S=net.states[qv],all=await Promise.all(S.map(call)),i=S.indexOf(qval),d=all[i],pct=x=>(x*100).toFixed(1),C=2*Math.PI*52;   // one answer per state of the variable
  const given=ev.length?`, given that ${ev.map(e=>`${e.v} is ${e.val}`).join(' and ')},`:'';
  const was=document.querySelector('#res details'),wasOpen=!was||was.open;
  $('res').innerHTML=`<div style="border-top:2px solid var(--line);margin-top:18px;padding-top:18px"><div class="resgrid">
  <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${pct(d.value)} percent"><circle cx="60" cy="60" r="52" class="rt"/><circle cx="60" cy="60" r="52" class="rf" style="stroke-dasharray:${C*d.value} ${C}"/><text x="60" y="67" text-anchor="middle" class="rn">${pct(d.value)}%</text></svg>
  <div class="dist"><p id="sent" aria-live="polite" style="font:19px var(--serif);margin:0 0 10px"></p>${S.map((x,j)=>`<div class="drow ${j===i?'me':''}"><span>${x}</span><div class="bar"><i style="width:${all[j].value*100}%"></i></div><b>${pct(all[j].value)}%</b></div>`).join('')}</div></div>
  <details><summary>How was this worked out?</summary><div class="row" style="margin-top:12px">
  <button class="ghost sm ${method==='enumeration'?'on':''}" onclick="method='enumeration';solve()">Enumeration</button>
  <button class="ghost sm ${method==='elimination'?'on':''}" onclick="method='elimination';solve()">Variable elimination</button></div>
  <p class="mut" id="how"></p><p id="formula" style="font-weight:600"></p><pre id="steps"></pre></details></div>`;
  $('sent').textContent=`The probability${given} that ${qv} is ${qval} is ${(d.value*100).toFixed(2)}%.`;
  $('how').textContent=HOW[method];$('formula').textContent=d.formula;$('steps').textContent=d.steps.join('\n');
  document.querySelector('#res details').open=wasOpen;solved=true;saveDraft()}
 catch(e){$('res').innerHTML='<p class="err" id="er"></p>';$('er').textContent=e instanceof TypeError?NOAPI:e.message}}
// ---------- save / open ----------
function fromBool(o){const st={},c={};   // old true/false files: 0.3 becomes [0.3, 0.7]
 for(const v of o.variables){st[v]=['true','false'];c[v]={};
  for(const[k,p]of Object.entries((o.cpt||{})[v]||{}))c[v][[...k].map(x=>x==='T'?'true':'false').join(',')]=[+p,+(1-p).toFixed(6)]}
 return{variables:o.variables,states:st,parents:o.parents||{},cpt:c}}
function loadNet(o){if(!o.states)o=fromBool(o);const vs=o.variables,P=o.parents||{},S=o.states||{},C=o.cpt||{};
 if(!Array.isArray(vs)||vs.length>MAX||new Set(vs).size!==vs.length||!vs.every(v=>/^\w{1,12}$/.test(v)))throw Error('This file isn’t a valid network');
 const n={variables:vs,states:{},parents:{},cpt:{}};
 for(const v of vs){const st=S[v],p=P[v]||[];
  if(!Array.isArray(st)||st.length<2||st.length>6||new Set(st).size!==st.length||!st.every(x=>/^\w{1,12}$/.test(x)))throw Error('Bad states for '+v);
  if(!Array.isArray(p)||p.some(x=>!vs.includes(x)||x===v)||new Set(p).size!==p.length)throw Error('Bad dependencies for '+v);
  n.states[v]=st;n.parents[v]=p}
 for(const v of vs){n.cpt[v]={};
  for(const k of keysFor(n,v)){const a=C[v]&&C[v][k];
   if(!Array.isArray(a)||a.length!==n.states[v].length||a.some(x=>!(x>=0&&x<=1))||Math.abs(a.reduce((t,y)=>t+Number(y),0)-1)>1e-5)throw Error('Bad probabilities for '+v);
   n.cpt[v][k]=a.map(Number)}}
 const done=new Set();let left=[...vs];
 while(left.length){const r=left.filter(v=>n.parents[v].every(p=>done.has(p)));
  if(!r.length)throw Error('The network has a loop');r.forEach(v=>done.add(v));left=left.filter(v=>!done.has(v))}
 n.pos={};for(const v of vs){const q=o.pos&&o.pos[v];if(Array.isArray(q)&&q.length===2&&q.every(Number.isFinite))n.pos[v]=q.map(Number)}
 net=n;deps=[];vs.forEach(c=>n.parents[c].forEach(p=>deps.push({c,p})));ev=[];qv=vs[0]||'';qval=n.states[qv]?n.states[qv][0]:'';screen=4;solved=false;renderAll()}
function save(){const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(net,null,2)],{type:'application/json'}));a.download='bayesynapse-network.json';a.click();toast('Network saved to your downloads')}
$('file').onchange=async e=>{try{loadNet(JSON.parse(await e.target.files[0].text()));toTop()}catch(x){toast(x.message)}e.target.value=''};
addEventListener('resize',()=>{if(screen===4)draw();if(screen==='draw')drawEd()});
paintTheme();if(!restoreSession())renderAll();
if(document.fonts)document.fonts.ready.then(centre);
</script></body></html>
